apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipfast-status-api
  namespace: shipfast
  labels:
    app.kubernetes.io/name: shipfast-status-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shipfast-status-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipfast-status-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Future changes: edit this tag in a pull request
          image: ghcr.io/kayla-marcus/shipfast-status-api:v1.2.0
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
